<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hierarquia Hospital</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="stars"></div>

    <main class="page">

        <header>
            <h1>HOSPITAL</h1>
            <p>HIERARQUIA DA EQUIPE</p>
            <div class="line"></div>
        </header>

        <section class="card">

            <label for="equipe">
                SELECIONE A EQUIPE:
            </label>

            <select id="equipe">
                <option value="hospital">Hospital</option>
            </select>

            <textarea id="json"
                      placeholder="Cole o JSON aqui... (opcional)"></textarea>

            <div class="buttons">

                <button id="gerarHierarquia">
                    GERAR HIERARQUIA
                </button>

                <button id="copiar">
                    COPIAR
                </button>

            </div>

            <div id="resultado"></div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
